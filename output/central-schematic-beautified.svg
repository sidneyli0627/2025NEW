<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9eef3"/>
      <stop offset="100%" stop-color="#dfe6ec"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b9cbd9"/>
      <stop offset="50%" stop-color="#9fb6c7"/>
      <stop offset="100%" stop-color="#879dac"/>
    </linearGradient>
    <linearGradient id="ductGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9e4ec"/>
      <stop offset="60%" stop-color="#c5d6e2"/>
      <stop offset="100%" stop-color="#acbecb"/>
    </linearGradient>
    <linearGradient id="chimneyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9ced6"/>
      <stop offset="50%" stop-color="#a1a8b5"/>
      <stop offset="100%" stop-color="#8c939f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <style>
      .stroke { stroke: #6e8799; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .thin   { stroke: #8aa2b3; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .label  { font: 14px Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #334155; }
      .caption{ font: 12px Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #6b7280; }
      .arrow  { fill: #2aa1ff; }
    </style>
  </defs>

  <!-- Background panel -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/>
  <rect x="80" y="80" width="1120" height="560" rx="18" fill="#ffffff" filter="url(#soft)"/>

  <!-- Top main pipe (kept layout: long horizontal header) -->
  <g transform="translate(120,150)" filter="url(#soft)">
    <rect x="0" y="0" width="840" height="48" rx="12" fill="url(#pipeGrad)" class="stroke"/>
    <!-- subtle ribs -->
    <rect x="140" y="0" width="6" height="48" fill="#6e8799" opacity="0.28"/>
    <rect x="420" y="0" width="6" height="48" fill="#6e8799" opacity="0.28"/>
    <rect x="700" y="0" width="6" height="48" fill="#6e8799" opacity="0.28"/>
    <!-- flow arrows -->
    <g class="arrow" opacity="0.9">
      <polygon points="80,24 60,14 60,34"/>
      <polygon points="360,24 340,14 340,34"/>
      <polygon points="640,24 620,14 620,34"/>
    </g>
  </g>

  <!-- Three drop pipes to filter units -->
  <g transform="translate(210,198)" filter="url(#soft)">
    <g>
      <rect x="0" y="0" width="48" height="90" rx="12" fill="url(#pipeGrad)" class="stroke"/>
    </g>
    <g transform="translate(280,0)">
      <rect x="0" y="0" width="48" height="90" rx="12" fill="url(#pipeGrad)" class="stroke"/>
    </g>
    <g transform="translate(560,0)">
      <rect x="0" y="0" width="48" height="90" rx="12" fill="url(#pipeGrad)" class="stroke"/>
    </g>
  </g>

  <!-- Filter housings (simplified, to preserve context but not change layout) -->
  <g transform="translate(160,310)" filter="url(#soft)">
    <g>
      <rect x="0" y="0" width="280" height="170" rx="10" fill="#f6f7f9" class="thin"/>
      <rect x="20" y="120" width="240" height="36" rx="8" fill="#dde5ec" class="thin"/>
      <text x="140" y="98" text-anchor="middle" class="label">33.2°C</text>
    </g>
    <g transform="translate(320,0)">
      <rect x="0" y="0" width="280" height="170" rx="10" fill="#f6f7f9" class="thin"/>
      <rect x="20" y="120" width="240" height="36" rx="8" fill="#dde5ec" class="thin"/>
      <text x="140" y="98" text-anchor="middle" class="label">32.0°C</text>
    </g>
    <g transform="translate(640,0)">
      <rect x="0" y="0" width="280" height="170" rx="10" fill="#f6f7f9" class="thin"/>
      <rect x="20" y="120" width="240" height="36" rx="8" fill="#dde5ec" class="thin"/>
      <text x="140" y="98" text-anchor="middle" class="label">33.0°C</text>
    </g>
  </g>

  <!-- Right-side elbow to vertical duct -->
  <g transform="translate(960,150)" filter="url(#soft)">
    <!-- elbow -->
    <path d="M0 24 h80 a48 48 0 0 1 48 48 v150" fill="none" stroke="#6e8799" stroke-width="24" stroke-linecap="round"/>
    <path d="M0 24 h80 a48 48 0 0 1 48 48 v150" fill="none" stroke="url(#pipeGrad)" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Fan between duct and chimney -->
  <g transform="translate(1070,410)" filter="url(#soft)">
    <circle cx="60" cy="60" r="54" fill="url(#ductGrad)" class="stroke"/>
    <circle cx="60" cy="60" r="38" fill="#ffffff" class="thin"/>
    <g transform="translate(60,60)" fill="#8fb5d6" stroke="#6e8799" stroke-width="1.6">
      <path d="M0 -6 C 14 -14, 38 -5, 40 8 C 28 3, 8 5, 0 6 Z"/>
      <path d="M6 0 C 14 14, 5 38 -8 40 C -3 28 -5 8 -6 0 Z"/>
      <path d="M0 6 C -14 14, -38 5, -40 -8 C -28 -3, -8 -5, 0 -6 Z"/>
      <path d="M-6 0 C -14 -14, -5 -38 8 -40 C 3 -28 5 -8 6 0 Z"/>
    </g>
    <circle cx="60" cy="60" r="8" fill="#6e8799"/>
  </g>

  <!-- Vertical chimney -->
  <g transform="translate(1160,180)" filter="url(#soft)">
    <rect x="0" y="0" width="56" height="360" rx="10" fill="url(#chimneyGrad)" class="stroke"/>
    <g opacity="0.5" fill="#6b7380">
      <rect x="0" y="90" width="56" height="6"/>
      <rect x="0" y="180" width="56" height="6"/>
      <rect x="0" y="270" width="56" height="6"/>
    </g>
    <path d="M-10 0 h76 l-8 -12 h-60 z" fill="#9aa3af" stroke="#6b7380" stroke-width="2"/>
    <!-- exhaust arrow -->
    <polygon class="arrow" points="28,-26 14,-46 42,-46"/>
  </g>

  <!-- Captions -->
  <text x="160" y="130" class="caption">保留原布局：主干管</text>
  <text x="980" y="140" class="caption">弯头至立管</text>
  <text x="1158" y="160" class="caption">烟囱</text>

</svg>

