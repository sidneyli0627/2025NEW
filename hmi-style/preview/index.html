<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HMI Schematic Preview</title>
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      body { background: var(--hmi-bg); font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 24px; color: #1f2937; }
      .card { background: var(--hmi-panel); border-radius: 12px; padding: 16px; box-shadow: 0 2px 4px rgba(0,0,0,.06), 0 12px 24px rgba(0,0,0,.08); }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
      .tile { display: flex; align-items: center; justify-content: center; min-height: 180px; border: 1px solid #e5e7eb; border-radius: 10px; }
      h1 { margin: 0 0 16px; font-size: 20px; }
      .caption { text-align: center; margin-top: 8px; color: #6b7280; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>设备示意图美化 - 组件预览</h1>
      <div class="grid">
        <div>
          <div class="tile"><img src="../svg/pipe-straight.svg" alt="pipe" width="360" /></div>
          <div class="caption">管道（直段）</div>
        </div>
        <div>
          <div class="tile"><img src="../svg/pipe-elbow.svg" alt="elbow" width="180" /></div>
          <div class="caption">管道（弯头）</div>
        </div>
        <div>
          <div class="tile"><img src="../svg/chimney.svg" alt="chimney" height="260" /></div>
          <div class="caption">烟囱</div>
        </div>
        <div>
          <div class="tile"><img src="../svg/duct-straight.svg" alt="duct" width="360" /></div>
          <div class="caption">风管（直段）</div>
        </div>
        <div>
          <div class="tile"><img src="../svg/fan-axial.svg" alt="fan" width="180" /></div>
          <div class="caption">轴流风机</div>
        </div>
        <div>
          <div class="tile"><img src="../svg/damper-butterfly.svg" alt="damper" width="220" /></div>
          <div class="caption">蝶阀/风阀</div>
        </div>
      </div>
    </div>
  </body>
</html>
